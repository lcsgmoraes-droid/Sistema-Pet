name: 📱 App Mobile - EAS Build Manual (Android APK)

on:
  workflow_dispatch:
    inputs:
      motivo:
        description: 'Por que um novo APK e necessario?'
        required: true
        type: string
      confirmar_necessidade_build:
        description: 'Confirmo que OTA nao atende (mudanca nativa, runtime novo ou APK indisponivel)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: eas-preview-android
  cancel-in-progress: false

jobs:
  build:
    name: 🔨 Build APK Android
    if: ${{ inputs.confirmar_necessidade_build }}
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v6

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: 📦 Instalar dependências
        working-directory: app-mobile
        run: npm install

      - name: 🔧 Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 🚀 Build APK (preview)
        working-directory: app-mobile
        run: eas build --platform android --profile preview --non-interactive
