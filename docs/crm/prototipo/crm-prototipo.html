function addMsg(id, de, txt) { CONVS[id].msgs.push(m(de, txt, agora())); var lx = lead(id); if (lx && de === "eu") lx.ult = "hoje · WhatsApp (enviado)"; if (lx && de === "tutor") lx.ult = "hoje · WhatsApp (tutor respondeu)"; }
function respostaIA(l, texto) {
  var t = texto.toLowerCase();
  if (/atendente|humano|pessoa|reclam|chatead|péssim/.test(t)) return { transf: true, txt: "Entendi. Vou chamar um atendente da loja para continuar com você." };
  if (/ra[cç][aã]o/.test(t)) return { txt: l.pets.length ? "Para a " + l.pets[0].n + ", a Premium Adultos 15 kg sai por R$ 189,00. Posso separar para retirada?" : "Temos várias opções de ração. Para qual pet seria e qual o peso dele?" };
  if (/vacina/.test(t)) return { txt: l.pets.length ? "A próxima dose da " + l.pets[0].n + " está próxima. Quer que eu veja um horário esta semana?" : "Para ver a vacina preciso identificar o pet. Qual o nome e o seu nome completo?" };
  if (/hor[aá]rio|fecham|abrem/.test(t)) return { txt: "Atendemos de segunda a sábado, das 8h às 18h." };
  if (/banho|tosa/.test(t)) return { txt: "Temos horário amanhã às 10h e às 15h. Qual você prefere?" };

function simTutor() {
  var l = lead(st.conv), c = CONVS[st.conv];
  var frases = { 1: "Quero falar com um atendente, o preço está errado", 3: "Pode ser quarta às 9h então", 4: "Quanto fica o plano de banho dos dois?", 5: "Oi, obrigada pelo carinho!", 6: "Vocês fazem tosa higiênica?", 8: "Vocês têm petisco dental?", 7: "Oi", 2: "Oi", 9: "Oi" };

  var rows = [["Kanban com filtro de lojas e loja em cada card", "Etapa 2 · Fase 2 P.2"], ["Ficha 360 e oportunidades", "Etapa 3 · P.3"], ["Caixa de conversas, assumir e devolver, janela de 24h", "Etapa 5 · P.4"], ["IA, parada, resumo para humano, créditos", "Etapas 0.1, 0.2 e 6 · P.5"], ["Automações, limites e consentimento", "Etapa 7 e 0.7 · P.6"], ["Canal por loja, funil, créditos, OPS", "Etapas 1, 4 e tema T.1 · P.7"], ["Um card por tutor com várias oportunidades, colunas configuráveis e ciclos", "Etapa 2 · P.2"]];
  var legenda = '<section class="panel" style="margin-bottom:14px"><header><h3>Cores: o que pede atenção e o que só informa</h3></header><div class="row"><span class="pill warn">Amarelo</span><span class="pill bad">Vermelho</span><span class="badge">Laranja</span><span class="small">pedem ação ou cuidado: pendências, bloqueios, não lidas, prazos, créditos baixos.</span></div><div class="row" style="margin-top:8px"><span class="pill info">Azul</span><span class="pill ok">Verde</span><span class="pill ia">Roxo</span><span class="small">apenas informam: origem, estado normal, quem está atendendo, confirmações.</span></div></section>';
  return legenda + '<section class="panel"><header><h3>O que cada tela cobre no roadmap</h3></header><div class="scroll"><table><tbody>' + rows.map(function (r) { return "<tr><td>" + r[0] + '</td><td class="small">' + r[1] + "</td></tr>"; }).join("") + '</tbody></table></div></section>' +
    '<section class="panel" style="margin-top:14px"><header><h3>Experimente</h3></header><ol class="steps"><li><span class="n">1</span><span>Kanban: arraste um card, filtre as lojas e abra a ficha de um tutor.</span></li><li><span class="n">2</span><span>Conversas: em "Camila", clique em Simular mensagem. A IA responde e gasta créditos. Quando o texto pede atendente, a conversa vai para a fila humana com resumo.</span></li><li><span class="n">3</span><span>Assuma a conversa da Juliana e veja o texto livre e a janela de 24h. Em Aline, a janela está fechada.</span></li><li><span class="n">4</span><span>Paulo disse SAIR e Henrique não tem consentimento: veja os bloqueios, inclusive em Automações > Simular disparo.</span></li><li><span class="n">5</span><span>Kanban: clique em "Simular sinais do dia". Sônia (concluída) volta para Novo no 2º ciclo, Roberto ganha uma oportunidade no card que já existe, e Aline recebe um sinal genérico esmaecido.</span></li><li><span class="n">6</span><span>Arraste Camila para "Resolvido": o sistema pergunta o que aconteceu com cada uma das 3 oportunidades. Depois arraste de volta para uma coluna em andamento para reabrir.</span></li><li><span class="n">7</span><span>Abra a ficha de Camila e use "Separar em outro card"; veja a "Caminhada do card" com os ciclos. Em Configurações da loja > Funil, renomeie colunas e mude os tipos.</span></li><li><span class="n">8</span><span>Na ficha, registre uma ação (ligação, visita, nota) e agende o próximo passo com data e hora. Cards sem próximo passo aparecem em amarelo, de hoje em amarelo e atrasados em vermelho (Henrique está atrasado).</span></li></ol></section>';
}

/* ================= Render e eventos ================= */
function render() {
  renderTop();
  var v = { kanban: viewKanban, conversas: viewConversas, auto: viewAuto, cfg: viewCfg, ops: viewOps, mapa: viewMapa }[st.tab];
  var foco = document.activeElement && document.activeElement.id;
  $("main").innerHTML = v(); $("drawer").innerHTML = viewDrawer() + viewFim();
  var ch = $("chat"); if (ch) ch.scrollTop = ch.scrollHeight;
  if (foco === "busca") { var e = $("busca"); e.focus(); e.setSelectionRange(e.value.length, e.value.length); }
}
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  var a = b.dataset.act, id = b.dataset.id;
  if (a === "aba") { st.tab = id; st.lead = null; }
  else if (a === "loja") { st.lojas[id] = !st.lojas[id]; if (!Object.keys(st.lojas).some(function (k) { return st.lojas[k]; })) st.lojas[id] = true; }
  else if (a === "lojas-todas") { Object.keys(st.lojas).forEach(function (k) { st.lojas[k] = true; }); }
  else if (a === "abrir-lead") { st.lead = +id; st.dtab = "ficha"; st.conv = lead(+id).conv; }
  else if (a === "abrir-conversa-card") { st.lead = +id; st.dtab = "conversa"; st.conv = lead(+id).conv; }
  else if (a === "dtab") st.dtab = id;
  else if (a === "ir-conversa-aba") { st.tab = "conversas"; st.conv = +id; st.lead = null; }
  else if (a === "fechar-lead") st.lead = null;
  else if (a === "ir-conversa") { st.tab = "conversas"; st.conv = +id; st.lead = null; }
  else if (a === "conv") st.conv = +id;
  else if (a === "novo-lead") { var nid = Math.max.apply(null, LEADS.map(function (x) { return x.id; })) + 1; LEADS.unshift({ id: nid, tutor: "Novo lead " + nid, tel: "(11) 90000-000" + nid, loja: Object.keys(st.lojas).filter(function (k) { return st.lojas[k]; })[0], etapa: ETAPAS.filter(function (x) { return x.t === "entrada"; })[0].id, origem: "WhatsApp espontâneo", resp: "Sem responsável", valor: 0, prox: "Qualificar o lead", consent: "nao", cad: false, pets: [], conv: nid, tl: [[agora(), "Lead", "Criado manualmente"]], ops: [op("WhatsApp espontâneo", "criado manualmente", { c: 1 })], ciclo: 1, desde: 0, ult: "agora", mov: [mv(1, ETAPAS.filter(function (x) { return x.t === "entrada"; })[0].n, "hoje")] }); setPa(LEADS[0], { tipo: "Outro", txt: "Qualificar o lead", dt: addDias(0), hr: "" }); CONVS[nid] = { estado: "ia", janela: 99, nao: 0, msgs: [m("sis", "Lead criado manualmente. Sem consentimento: apenas resposta ao tutor é permitida.", "")] }; toast("Lead criado na etapa Novo."); }
  else if (a === "criar-cadastro") { var l0 = lead(+id); l0.cad = true; l0.tutor = l0.semNome ? "Novo tutor" : l0.tutor; PES[l0.id] = { cod: "C-" + (1500 + l0.id), cpf: "—", email: "—", end: "—", desde: "agora", n: 0, total: 0, ticket: 0, cash: 0, cred: 0 }; l0.tl.unshift([agora(), "Cadastro", "Cadastro criado a partir do lead"]); toast("Cadastro criado (simulado) com o nome e o número do WhatsApp."); }
  else if (a === "vincular") { var l = lead(+id); l.cad = true; l.tutor = "Fernanda Ribeiro"; PES[l.id] = { cod: "C-0688", cpf: "***.402.118-**", email: "fernanda.r@email.com", end: "Rua Azul, 55 · Jardins", desde: "04/2022", n: 12, total: 1650, ticket: 138, cash: 9.5, cred: 0 }; l.pets = [{ n: "Toby", d: "Spitz, 3 anos" }]; l.tl.unshift([agora(), "Cadastro", "Vinculado a Fernanda Ribeiro"]); toast("Lead vinculado a um cadastro existente (simulado)."); }
  else if (a === "assumir") { var c = CONVS[st.conv]; c.estado = "humano"; addMsg(st.conv, "inf", "Atendimento assumido por Marina. A IA não responde mais nesta conversa."); }
  else if (a === "devolver") { CONVS[st.conv].estado = "ia"; addMsg(st.conv, "inf", "Conversa devolvida à IA."); }
  else if (a === "encerrar") { CONVS[st.conv].estado = "encerrada"; addMsg(st.conv, "inf", "Atendimento encerrado."); }
  else if (a === "enviar") { var t = $("txt"); if (!t || !t.value.trim()) return; addMsg(st.conv, "eu", t.value.trim()); cobrar(1, "Resposta do atendente"); }
  else if (a === "nota") { var t2 = $("txt"); if (!t2 || !t2.value.trim()) return toast("Escreva a nota no campo e clique de novo."); addMsg(st.conv, "nota", t2.value.trim()); }
  else if (a === "sim-tutor") { return simTutor(); }
  else if (a === "modelo") { var ll = lead(+id); if (ll.consent === "saiu" || ll.consent === "nao") return toast("Bloqueado: tutor sem consentimento. Nada enviado."); if (st.saldo < 2) return toast("Créditos insuficientes."); addMsg(ll.conv, "eu", "[Modelo reativacao_v1] Olá, " + ll.tutor.split(" ")[0] + "! Sentimos sua falta. Quer ver as novidades da loja?"); cobrar(4, "Modelo reativacao_v1 · " + ll.tutor.split(" ")[0]); CONVS[ll.conv].estado = CONVS[ll.conv].estado === "encerrada" ? "ia" : CONVS[ll.conv].estado; toast("Modelo enviado (4 créditos)."); }
  else if (a === "disparar") return disparar(+b.dataset.i);
  else if (a === "pa-rapido") { var dd = $("pa-dt"); if (dd) dd.value = addDias(+b.dataset.d); return; }
  else if (a === "acao-registrar") { var lr = lead(+id), tpa = $("acao-tipo").value, obs = $("acao-obs").value.trim(), conc = $("acao-conclui"), concluiu = !!(conc && conc.checked && lr.pa); lr.tl.unshift([agora(), "Ação", tpa + (obs ? " · " + obs : "")]); lr.ult = "hoje · " + tpa; if (concluiu) setPa(lr, null); toast("Ação registrada." + (concluiu ? " Próximo passo concluído: agende o seguinte." : "")); }
  else if (a === "pa-agendar") { var lp = lead(+id), dtv = $("pa-dt").value, hrv = $("pa-hr").value, txtv = $("pa-txt").value.trim(), tipov = $("pa-tipo").value; if (!dtv) return toast("Escolha a data do próximo passo."); if (difDias(dtv) < 0) return toast("A data não pode ser no passado."); setPa(lp, { tipo: tipov, txt: txtv || tipov, dt: dtv, hr: hrv }); lp.resp = $("pa-resp").value; lp.tl.unshift([agora(), "Agenda", tipov + " · " + (txtv || tipov) + " · " + paQuando(lp.pa)]); toast("Próximo passo agendado: " + paQuando(lp.pa) + "."); }
  else if (a === "pa-remover") { var lq = lead(+id); setPa(lq, null); lq.tl.unshift([agora(), "Agenda", "Agendamento removido"]); toast("Agendamento removido."); }
  else if (a === "ver-todos") st.verTodos = !st.verTodos;
  else if (a === "sim-sinais") return simSinais();
  else if (a === "sinal-ficha") { var lf = lead(+id), tp = $("sinal-tipo").value, dets = { "Ração acabando": "acaba em 5 dias", "Vacina vencendo": "vence em 7 dias", "Sem comprar": "46 dias", "Aniversário do pet": "em 6 dias", "Cashback a vencer": "vence em 10 dias" }; if (hasOp(lf, tp)) toast("Já existe essa oportunidade aberta para o tutor."); else toast(novoSinal(lf, op(tp, dets[tp], { gen: tp === "Sem comprar" })) + "."); }
  else if (a === "separar") { separar(+id, +b.dataset.i); }
  else if (a === "fim-ok") return confirmarFim();
  else if (a === "fim-cancel") st.fim = null;
  else if (a === "col-sobe" || a === "col-desce") { var ci = +b.dataset.i, cj = a === "col-sobe" ? ci - 1 : ci + 1; if (cj >= 0 && cj < ETAPAS.length) { var tmp = ETAPAS[ci]; ETAPAS[ci] = ETAPAS[cj]; ETAPAS[cj] = tmp; } }
  else if (a === "col-remove") { var ce = ETAPAS[+b.dataset.i], ncards = LEADS.filter(function (x) { return x.etapa === ce.id; }).length, mesmo = ETAPAS.filter(function (x) { return x.t === ce.t; }).length; if (ncards) toast("Mova os " + ncards + " card(s) desta coluna antes de apagar."); else if ((ce.t === "entrada" || ce.t === "concluido") && mesmo === 1) toast("Precisa existir ao menos uma coluna de " + TIPOS[ce.t].toLowerCase() + "."); else { ETAPAS.splice(+b.dataset.i, 1); toast("Coluna apagada."); } }
  else if (a === "col-add") { if (ETAPAS.length >= 8) toast("O limite é de 8 colunas."); else { var pos = ETAPAS.length; ETAPAS.forEach(function (x, k) { if (ehFim(x) && k < pos) pos = k; }); ETAPAS.splice(pos, 0, { id: "col" + Date.now(), n: "Nova coluna", t: "andamento" }); toast("Coluna adicionada antes das colunas finais."); } }
  else if (a === "cfgtab") st.cfgTab = id; else if (a === "opstab") st.opsTab = id;
  else if (a === "toast") return toast(b.dataset.t);
  else if (a === "conectar") { var lj = loja(id); lj.num = "+55 11 3000-3333"; lj.q = "Alta"; toast("Número conectado (simulado). A conexão real será decidida na Etapa 4."); }
  else if (a === "comprar") { var p = PACOTES[+b.dataset.i]; var n = parseInt(p[0].replace(/\D/g, ""), 10); st.saldo += n; st.extrato.unshift([agora(), "Pacote " + p[0], "+" + n]); toast("Pacote adicionado ao saldo (simulado)."); }
  render();
});
document.addEventListener("change", function (e) {
  var t = e.target, a = t.dataset.act;
  if (!a && ["fresp", "forig", "freq", "sil", "tom", "dconcl"].indexOf(t.id) < 0) return;
  if (a === "mover") return moverLead(+t.dataset.id, t.value);
  if (a === "auto-on") { AUTO[+t.dataset.i].on[t.dataset.l] = t.checked; toast(AUTO[+t.dataset.i].nome + ": " + (t.checked ? "ligada" : "desligada") + " em " + loja(t.dataset.l).nome + "."); }
  else if (a === "cons") {
    var cc = st.cons[t.dataset.s]; cc[t.dataset.k] = t.value;
    if (t.dataset.k === "lead" && t.value === "perdido") { var n = 0, enc = ETAPAS.filter(function (x) { return x.t === "encerrado"; })[0]; if (!enc) { toast("Crie uma coluna de encerrado sem resultado antes."); } else { LEADS.slice().forEach(function (l) { if (l.consent === "saiu" && !ehFim(etp(l.etapa))) { n++; opsAbertas(l).forEach(function (o) { o.st = "descartada"; o.motivo = "Recusou mensagens"; }); l.perda = "Recusou mensagens"; setPa(l, null); moverLead(l.id, enc.id, true); } }); toast("Regra salva. " + n + " card(s) movido(s) para " + enc.n + "."); } }
    else toast("Regra salva e aplicada nos cards.");
  }
  else if (a === "fim-r") { st.fim.sel[+t.dataset.i].r = t.value; }
  else if (a === "fim-m") { st.fim.sel[+t.dataset.i].m = t.value; }
  else if (a === "tipo-col") { var ci2 = +t.dataset.i, ce2 = ETAPAS[ci2], restantes = ETAPAS.filter(function (x, k) { return k !== ci2 && x.t === ce2.t; }).length; if ((ce2.t === "entrada" || ce2.t === "concluido") && restantes === 0 && t.value !== ce2.t) toast("Precisa existir ao menos uma coluna de " + TIPOS[ce2.t].toLowerCase() + "."); else ce2.t = t.value; }
  else if (a === "ia-perm") { st.ia[t.dataset.k] = t.checked; toast("Preferência salva."); }
  else if (a === "renomear") { ETAPAS[+t.dataset.i].n = t.value; }
  else if (t.id === "fresp") st.resp = t.value; else if (t.id === "forig") st.origem = t.value; else if (t.id === "dconcl") st.diasConcl = Math.max(1, +t.value || 7);
  else if (t.id === "freq") st.freq = Math.max(1, +t.value || 1); else if (t.id === "sil") st.silencio = t.checked; else if (t.id === "tom") st.tom = t.value;
  render();
});
document.addEventListener("input", function (e) { if (e.target.id === "busca") { st.busca = e.target.value; render(); } });
/* arrastar e soltar */
document.addEventListener("dragstart", function (e) { var c = e.target.closest && e.target.closest(".card"); if (!c) return; e.dataTransfer.setData("text/plain", c.dataset.id); e.dataTransfer.effectAllowed = "move"; });
document.addEventListener("dragover", function (e) { var col = e.target.closest && e.target.closest(".colk"); if (col) { e.preventDefault(); document.querySelectorAll(".colk.over").forEach(function (x) { if (x !== col) x.classList.remove("over"); }); col.classList.add("over"); } });
document.addEventListener("drop", function (e) { var col = e.target.closest && e.target.closest(".colk"); if (!col) return; e.preventDefault(); var id = +e.dataTransfer.getData("text/plain"); moverLead(id, col.dataset.col); });
document.addEventListener("dragend", function () { document.querySelectorAll(".colk.over").forEach(function (x) { x.classList.remove("over"); }); });
render();
</script>
