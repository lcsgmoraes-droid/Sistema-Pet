function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function $(id) { return document.getElementById(id); }
function toast(t) { var e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { e.hidden = true; }, 3200); }
function loja(id) { return LOJAS.filter(function (l) { return l.id === id; })[0]; }
function lead(id) { return LEADS.filter(function (l) { return l.id === id; })[0]; }
function tagLoja(id) { var l = loja(id); return '<span class="loja"><span class="dot" style="background:' + l.cor + '"></span>' + esc(l.nome.replace("Pet Amigo ", "")) + "</span>"; }
function money(v) { return "R$ " + Number(v).toLocaleString("pt-BR", { minimumFractionDigits: 2 }); }
var CONS = { ok: ["ok", "Consentimento confirmado"], sistema: ["info", "Aceitou no sistema"], nao: ["warn", "Sem consentimento"], saiu: ["bad", "Cancelou (SAIR)"] };
var EST = { ia: ["ia", "IA atendendo"], humano: ["info", "Humano atendendo"], aguardando: ["warn", "Aguardando atendente"], encerrada: ["", "Encerrada"] };
function pillCons(c) { return '<span class="pill ' + CONS[c][0] + '">' + CONS[c][1] + "</span>"; }
function lojasVisiveis() { return LEADS.filter(function (l) { return st.lojas[l.loja] && USER_LOJAS.indexOf(l.loja) >= 0; }); }
function agora() { var d = new Date(); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
function cobrar(n, motivo) { st.saldo -= n; st.extrato.unshift([agora(), motivo, "-" + n]); }
function tpl(t, ex) { return esc(t).replace(/\{\{(\d)\}\}/g, function (x, n) { return '<b class="mono">' + esc(ex[n - 1] || x) + "</b>"; }); }

/* ================= Cabeçalho ================= */
function renderTop() {
  $("sub").textContent = st.tab === "ops" ? "Visão da equipe CorePet: todas as lojas, provedor, modelos e pacotes." : "Relacionamento com o tutor, por loja.";
  var chips = LOJAS.map(function (l) { return '<button type="button" class="chip" data-act="loja" data-id="' + l.id + '" aria-pressed="' + st.lojas[l.id] + '"><span class="dot" style="background:' + l.cor + '"></span>' + esc(l.nome.replace("Pet Amigo ", "")) + "</button>"; }).join("");
  $("topbar").innerHTML = '<span class="small">Lojas:</span>' + chips + '<button type="button" class="chip" data-act="lojas-todas">Ver todas</button>' +
    '<span class="pill ' + (st.saldo < 500 ? "bad" : "info") + '" title="Créditos de mensagens e IA">Créditos: ' + st.saldo.toLocaleString("pt-BR") + "</span>";
  var nao = Object.keys(CONVS).filter(function (k) { var c = CONVS[k]; return c.nao && st.lojas[lead(+k).loja]; }).length;
  $("tabs").innerHTML = TABS.map(function (t) {
    return '<button type="button" role="tab" data-act="aba" data-id="' + t[0] + '" aria-selected="' + (st.tab === t[0]) + '">' + t[1] + (t[0] === "conversas" && nao ? ' <span class="badge">' + nao + "</span>" : "") + "</button>";
  }).join("");
}

/* ================= Kanban ================= */
function viewKanban() {
  var vis = lojasVisiveis().filter(function (l) {
    return (st.resp === "Todos" || l.resp === st.resp) && (st.origem === "Todas" || l.origem === st.origem) &&
      (!st.busca || (l.tutor + " " + l.pets.map(function (p) { return p.n; }).join(" ")).toLowerCase().indexOf(st.busca.toLowerCase()) >= 0);
  });
  var total = vis.reduce(function (a, l) { return a + l.valor; }, 0);
  var filtros = '<div class="row" style="margin-bottom:12px"><label class="f" style="min-width:200px;flex:1">Buscar<input type="text" id="busca" value="' + esc(st.busca) + '" placeholder="Tutor ou pet"></label>' +
    '<label class="f">Responsável<select id="fresp"><option>Todos</option>' + RESP.map(function (r) { return "<option" + (st.resp === r ? " selected" : "") + ">" + r + "</option>"; }).join("") + "</select></label>" +
    '<label class="f">Origem<select id="forig"><option>Todas</option>' + ORIGENS.map(function (r) { return "<option" + (st.origem === r ? " selected" : "") + ">" + r + "</option>"; }).join("") + "</select></label>" +
    '<div style="align-self:end"><button class="btn pri" type="button" data-act="novo-lead">Novo lead</button></div></div>';
  var cols = ETAPAS.map(function (e) {
    var cs = vis.filter(function (l) { return l.etapa === e.id; });
    var soma = cs.reduce(function (a, l) { return a + l.valor; }, 0);
    return '<section class="colk" data-col="' + e.id + '" aria-label="' + e.n + '"><header><h3>' + e.n + ' <span class="small">' + cs.length + '</span></h3><span class="small">' + money(soma) + "</span></header>" +
      (cs.length ? cs.map(cardLead).join("") : '<p class="small">Nenhum lead nesta etapa com os filtros atuais.</p>') + "</section>";
  }).join("");
  var multi = lojasVisiveis().length && Object.keys(st.lojas).filter(function (k) { return st.lojas[k]; }).length > 1;
  return filtros + '<p class="small" style="margin-bottom:8px">' + vis.length + " leads · potencial " + money(total) + (multi ? " · cada card mostra a loja; use os botões de loja acima para filtrar" : "") + '</p><div class="board">' + cols + "</div>";
}
function cardLead(l) {
  var lj = loja(l.loja);
  return '<article class="card" draggable="true" data-id="' + l.id + '" style="--lc:' + lj.cor + '"><div class="row" style="justify-content:space-between">' + tagLoja(l.loja) + '<span class="small">' + esc(l.resp) + "</span></div>" +
    '<button type="button" class="nm" data-act="abrir-lead" data-id="' + l.id + '">' + esc(l.tutor) + "</button>" +
    '<p class="small">' + (l.pets.length ? l.pets.map(function (p) { return esc(p.n); }).join(", ") : "Sem pet cadastrado") + "</p>" +
    '<div class="row" style="margin-top:6px"><span class="pill info">' + esc(l.origem) + "</span>" + (l.consent === "ok" || l.consent === "sistema" ? "" : '<span class="pill ' + CONS[l.consent][0] + '">' + CONS[l.consent][1] + "</span>") + "</div>" +
    (l.prox !== "—" ? '<p class="small" style="margin-top:6px">Próxima ação: ' + esc(l.prox) + "</p>" : "") +
    (l.valor ? '<p class="small">' + money(l.valor) + "</p>" : "") +
    '<select data-act="mover" data-id="' + l.id + '" aria-label="Mover ' + esc(l.tutor) + ' para outra etapa">' + ETAPAS.map(function (e) { return '<option value="' + e.id + '"' + (e.id === l.etapa ? " selected" : "") + ">" + (e.id === l.etapa ? "Etapa: " : "Mover: ") + e.n + "</option>"; }).join("") + "</select></article>";
}
function moverLead(id, etapa) {
  var l = lead(id); if (!l || l.etapa === etapa) return;
  var de = ETAPAS.filter(function (e) { return e.id === l.etapa; })[0].n, para = ETAPAS.filter(function (e) { return e.id === etapa; })[0].n;
  l.etapa = etapa; l.tl.unshift([agora(), "Etapa", de + " → " + para]);
  if (etapa === "perdido" && !l.perda) l.perda = "A definir";
  toast(l.tutor + ": " + para + " (histórico registrado)."); render();
}

/* ================= Ficha 360 ================= */
function viewDrawer() {
  if (!st.lead) return "";
  var l = lead(st.lead), c = CONVS[l.conv];
  var pets = l.pets.length ? l.pets.map(function (p) { return '<li><b>' + esc(p.n) + '</b> <span class="muted">' + esc(p.d) + "</span></li>"; }).join("") : '<li class="muted">Nenhum pet. Ao vincular ao cadastro, os pets aparecem aqui.</li>';
  var tl = l.tl.map(function (t) { return '<li><span class="d">' + t[0] + '</span><span><b>' + t[1] + "</b> · " + esc(t[2]) + "</span></li>"; }).join("");
  var opp = l.opp.length ? l.opp.map(function (o) { return '<li class="note" style="margin-bottom:6px">' + esc(o) + "</li>"; }).join("") : '<li class="small">Sem oportunidades no momento.</li>';
  return '<div class="drawer" role="dialog" aria-modal="true" aria-label="Ficha do tutor"><div><div class="row" style="justify-content:space-between"><h2>' + esc(l.tutor) + '</h2><button class="btn sm" type="button" data-act="fechar-lead">Fechar</button></div>' +
    '<div class="row">' + tagLoja(l.loja) + '<span class="pill">' + esc(l.tel) + "</span>" + pillCons(l.consent) + (l.cad ? "" : '<span class="pill warn">Sem cadastro</span>') + "</div>" +
    '<div class="row"><button class="btn pri sm" type="button" data-act="ir-conversa" data-id="' + l.conv + '">Abrir conversa</button>' + (l.cad ? "" : '<button class="btn sm" type="button" data-act="vincular" data-id="' + l.id + '">Vincular a cadastro</button>') +
    '<select aria-label="Etapa" data-act="mover" data-id="' + l.id + '" style="width:auto">' + ETAPAS.map(function (e) { return '<option value="' + e.id + '"' + (e.id === l.etapa ? " selected" : "") + ">" + e.n + "</option>"; }).join("") + "</select></div>" +
    '<section class="panel"><header><h4>Oportunidades sugeridas</h4><span class="small">com o motivo de cada uma</span></header><ul style="list-style:none;padding:0;margin:0">' + opp + "</ul></section>" +
    '<section class="panel"><header><h4>Pets</h4></header><ul style="margin:0;padding-left:18px">' + pets + "</ul></section>" +
    '<section class="panel"><header><h4>Linha do tempo</h4><span class="small">compras, saúde, banho, mensagens, etapas</span></header><ul class="tl">' + tl + "</ul></section>" +
    '<section class="panel"><header><h4>Responsável e próxima ação</h4></header><p class="muted">' + esc(l.resp) + " · " + esc(l.prox) + "</p>" + (l.perda ? '<p class="small">Motivo da perda: ' + esc(l.perda) + "</p>" : "") + "</section>" +
    '<p class="small">Conversa: ' + (c ? EST[c.estado][1] : "—") + "</p></div></div>";
}

/* ================= Conversas ================= */
function viewConversas() {
  var ids = Object.keys(CONVS).filter(function (k) { var l = lead(+k); return st.lojas[l.loja]; });
  var list = ids.map(function (k) {
    var c = CONVS[k], l = lead(+k), ult = c.msgs.filter(function (x) { return x.de !== "nota"; }).slice(-1)[0];
    return '<button type="button" class="citem" data-act="conv" data-id="' + k + '" aria-current="' + (st.conv === +k) + '"><div class="row" style="justify-content:space-between"><b>' + esc(l.tutor.split(" (")[0]) + "</b>" + (c.nao ? '<span class="badge">' + c.nao + "</span>" : "") + "</div>" +
      '<div class="row">' + tagLoja(l.loja) + '<span class="pill ' + EST[c.estado][0] + '">' + EST[c.estado][1] + "</span></div>" +
      '<p class="small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(ult ? ult.txt : "") + "</p></button>";
  }).join("") || '<p class="small">Nenhuma conversa nas lojas selecionadas.</p>';
  var l = lead(st.conv), c = CONVS[st.conv];
  if (!l || !st.lojas[l.loja]) return '<div class="inbox"><div class="clist">' + list + '</div><div class="panel"><p class="muted">Selecione uma conversa.</p></div></div>';
  c.nao = 0;
  var bolhas = c.msgs.map(function (x) {
    var cls = x.de === "tutor" ? "" : x.de === "eu" ? "eu" : x.de === "ia" ? "ia" : x.de === "sis" ? "sis" : "nota";
    var quem = x.de === "ia" ? "IA · " : x.de === "eu" ? "Atendente · " : x.de === "nota" ? "Nota interna · " : "";
    return '<div class="msg ' + cls + '">' + quem + esc(x.txt) + (x.w ? '<span class="w">' + x.w + "</span>" : "") + "</div>";
  }).join("") + (st.digitando ? '<div class="msg ia">IA digitando…</div>' : "");
  var fora = c.janela >= 24, bloq = l.consent === "saiu";
  var topo = '<div class="row" style="justify-content:space-between;margin-bottom:8px"><div><h3>' + esc(l.tutor.split(" (")[0]) + '</h3><div class="row">' + tagLoja(l.loja) + '<span class="pill ' + EST[c.estado][0] + '">' + EST[c.estado][1] + "</span>" + pillCons(l.consent) +
    (fora ? '<span class="pill warn">Fora da janela de 24h</span>' : '<span class="pill ok">Janela aberta · ' + (24 - c.janela) + "h</span>") + "</div></div><div class=\"row\">" +
    (c.estado === "ia" ? '<button class="btn sm" type="button" data-act="assumir">Assumir atendimento</button>' : "") +
    (c.estado === "aguardando" ? '<button class="btn pri sm" type="button" data-act="assumir">Assumir</button>' : "") +
    (c.estado === "humano" ? '<button class="btn sm" type="button" data-act="devolver">Devolver à IA</button><button class="btn sm" type="button" data-act="encerrar">Encerrar</button>' : "") +
    '<button class="btn sm" type="button" data-act="abrir-lead" data-id="' + l.id + '">Ficha 360</button></div></div>';
  var resumo = c.resumo && c.estado === "aguardando" ? '<div class="note warn" style="margin-bottom:8px"><b>Resumo da IA para quem assume:</b> ' + esc(c.resumo) + "</div>" : "";
  var avisoIA = c.estado === "ia" ? '<div class="note" style="margin-top:8px">A IA responde sozinha. Se o tutor pedir atendente, reclamar ou os créditos acabarem, a conversa vai para a fila humana.</div>' : "";
  var composer;
  if (bloq) composer = '<div class="note bad" style="margin-top:8px">O tutor cancelou o recebimento (SAIR). Nenhuma mensagem pode ser enviada.</div>';
  else if (c.estado === "encerrada") composer = '<div class="note" style="margin-top:8px">Conversa encerrada. Uma nova mensagem do tutor reabre o atendimento.</div>';
  else if (c.estado !== "humano") composer = avisoIA + '<div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-act="sim-tutor">Simular mensagem do tutor</button><button class="btn sm" type="button" data-act="modelo" data-id="' + l.id + '">Enviar modelo aprovado</button></div>';
  else composer = '<div style="margin-top:8px;display:grid;gap:6px">' + (fora ? '<div class="note warn">Fora da janela de 24h: só modelo aprovado. Texto livre fica desabilitado.</div>' : "") +
    '<textarea id="txt" aria-label="Mensagem" placeholder="' + (fora ? "Texto livre indisponível" : "Escreva a resposta") + '"' + (fora ? " disabled" : "") + '></textarea><div class="row"><button class="btn pri sm" type="button" data-act="enviar"' + (fora ? " disabled" : "") + '>Enviar</button><button class="btn sm" type="button" data-act="modelo" data-id="' + l.id + '">Enviar modelo aprovado</button><button class="btn sm" type="button" data-act="nota">Nota interna</button><button class="btn sm" type="button" data-act="sim-tutor">Simular mensagem do tutor</button></div></div>';
  var lado = '<aside class="panel"><h4>Contexto rápido</h4><p class="small">' + esc(l.tel) + "</p>" + (l.pets.length ? '<ul style="padding-left:16px;margin:8px 0">' + l.pets.map(function (p) { return "<li>" + esc(p.n) + ' <span class="small">' + esc(p.d) + "</span></li>"; }).join("") + "</ul>" : '<p class="small" style="margin:8px 0">Sem cadastro vinculado.</p>') +
    '<h4 style="margin-top:8px">Sugestões</h4>' + (l.opp.length ? l.opp.map(function (o) { return '<p class="small" style="margin:4px 0">• ' + esc(o) + "</p>"; }).join("") : '<p class="small">Nada no momento.</p>') + "</aside>";
  return '<div class="inbox"><div class="clist">' + list + '</div><div class="panel">' + topo + resumo + '<div class="chat" id="chat">' + bolhas + "</div>" + composer + "</div>" + lado + "</div>";
}
function addMsg(id, de, txt) { CONVS[id].msgs.push(m(de, txt, agora())); }
function respostaIA(l, texto) {
  var t = texto.toLowerCase();
  if (/atendente|humano|pessoa|reclam|chatead|péssim/.test(t)) return { transf: true, txt: "Entendi. Vou chamar um atendente da loja para continuar com você." };
  if (/ra[cç][aã]o/.test(t)) return { txt: l.pets.length ? "Para a " + l.pets[0].n + ", a Premium Adultos 15 kg sai por R$ 189,00. Posso separar para retirada?" : "Temos várias opções de ração. Para qual pet seria e qual o peso dele?" };
  if (/vacina/.test(t)) return { txt: l.pets.length ? "A próxima dose da " + l.pets[0].n + " está próxima. Quer que eu veja um horário esta semana?" : "Para ver a vacina preciso identificar o pet. Qual o nome e o seu nome completo?" };
  if (/hor[aá]rio|fecham|abrem/.test(t)) return { txt: "Atendemos de segunda a sábado, das 8h às 18h." };
  if (/banho|tosa/.test(t)) return { txt: "Temos horário amanhã às 10h e às 15h. Qual você prefere?" };
  return { txt: "Posso ajudar com produtos, banho e tosa, vacinas e horários. Me conta o que você precisa." };
}
function simTutor() {
  var l = lead(st.conv), c = CONVS[st.conv];
  var frases = { 1: "Quero falar com um atendente, o preço está errado", 3: "Pode ser quarta às 9h então", 4: "Quanto fica o plano de banho dos dois?", 5: "Oi, obrigada pelo carinho!", 6: "Vocês fazem tosa higiênica?", 8: "Vocês têm petisco dental?", 7: "Oi", 2: "Oi", 9: "Oi" };
  var ex = ["Tem ração de 15 kg?", "Que horas vocês abrem?", "Quero marcar um banho", "A vacina da " + (l.pets[0] ? l.pets[0].n : "pet") + " está atrasada?", "Quero falar com um atendente"];
  var texto = c.estado === "ia" ? ex[Math.floor(Math.random() * ex.length)] : (frases[l.id] || "Oi");
  if (c.estado === "encerrada") { c.estado = "ia"; }
  addMsg(st.conv, "tutor", texto); c.janela = 0;
  if (c.estado === "ia") {
    if (l.consent === "saiu") { return render(); }
    if (st.saldo <= 0) { c.estado = "aguardando"; addMsg(st.conv, "sis", "Créditos esgotados: a IA parou e a conversa foi para a fila humana."); return render(); }
    st.digitando = true; render();
    var cid = st.conv;
    setTimeout(function () {
      st.digitando = false; var r = respostaIA(l, texto); addMsg(cid, "ia", r.txt); cobrar(3, "Resposta da IA · " + l.tutor.split(" (")[0]);
      if (r.transf) { var cc = CONVS[cid]; cc.estado = "aguardando"; cc.resumo = "O tutor pediu atendimento humano. Contexto: " + (l.opp[0] || "sem oportunidade aberta") + ". Última etapa do lead: " + l.etapa + "."; addMsg(cid, "sis", "IA transferiu para atendimento humano: pedido do tutor."); }
      render();
    }, 900);
  } else if (c.estado === "humano") { c.nao = 0; render(); }
  else render();
}

/* ================= Automações ================= */
function viewAuto() {
  var cards = AUTO.map(function (a, i) {
    var sw = LOJAS.map(function (l) { return '<label class="sw"><input type="checkbox" data-act="auto-on" data-i="' + i + '" data-l="' + l.id + '"' + (a.on[l.id] ? " checked" : "") + (l.num.indexOf("não") >= 0 ? " disabled" : "") + ' aria-label="' + a.nome + " em " + l.nome + '">' + esc(l.nome.replace("Pet Amigo ", "")) + (l.num.indexOf("não") >= 0 ? ' <span class="small">sem número</span>' : "") + "</label>"; }).join("");
    return '<article class="panel"><header><h3>' + a.nome + '</h3><span class="row"><span class="pill ' + (a.meta === "Aprovado" ? "ok" : "warn") + '">Meta: ' + a.meta + '</span><span class="pill">' + a.cat + "</span></span></header>" +
      '<p class="muted">' + a.gat + '</p><div class="note" style="margin:8px 0"><b class="mono">' + a.modelo + "</b><br>" + tpl(a.txt, a.ex) + "</div>" +
      '<div class="row">' + sw + '</div><div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-act="disparar" data-i="' + i + '"' + (a.meta !== "Aprovado" ? " disabled" : "") + ">Simular disparo</button><span class=\"small\">Custo de exemplo: " + (a.cat === "Marketing" ? 4 : 2) + " créditos por mensagem</span></div></article>";
  }).join("");
  return '<div class="grid g2" style="margin-bottom:14px"><section class="panel"><header><h3>Regras gerais</h3></header>' +
    '<label class="f">Máximo de mensagens ativas por tutor a cada 7 dias<input type="number" id="freq" value="' + st.freq + '" min="1" max="7"></label>' +
    '<label class="sw" style="margin-top:6px"><input type="checkbox" id="sil"' + (st.silencio ? " checked" : "") + '> Não enviar entre 20h e 8h</label>' +
    '<p class="small" style="margin-top:6px">Valem para todas as automações da loja. O consentimento é verificado em todo envio.</p></section>' +
    '<section class="panel"><header><h3>Como o disparo é decidido</h3></header><ol class="steps"><li><span class="n">1</span><span>Gatilho acontece (ex.: vacina em 7 dias).</span></li><li><span class="n">2</span><span>Confere consentimento, limite por tutor e horário.</span></li><li><span class="n">3</span><span>Confere se a loja ligou a automação e tem créditos.</span></li><li><span class="n">4</span><span>Envia o modelo aprovado e registra na conversa e no lead.</span></li></ol></section></div>' +
    '<div class="grid g2">' + cards + "</div>";
}
function disparar(i) {
  var a = AUTO[i], cand = LEADS.filter(function (l) { return l.origem === a.origem || (a.id === "med" && false); });
  var l = cand.filter(function (x) { return a.on[x.loja]; })[0] || cand[0];
  if (!l) return toast("Nenhum tutor elegível agora para este gatilho.");
  if (!a.on[l.loja]) return toast("Automação desligada na loja " + loja(l.loja).nome + ": nada enviado.");
  if (l.consent === "saiu" || l.consent === "nao") return toast("Bloqueado: " + l.tutor.split(" (")[0] + " sem consentimento (" + CONS[l.consent][1] + "). Nada enviado.");
  if (l.freq && l.freq >= st.freq) return toast("Bloqueado: limite de " + st.freq + " mensagem(ns) ativa(s) por tutor atingido.");
  if (st.saldo < 4) return toast("Créditos insuficientes.");
  var custo = a.cat === "Marketing" ? 4 : 2; l.freq = (l.freq || 0) + 1; cobrar(custo, "Modelo " + a.modelo + " · " + l.tutor.split(" (")[0]);
  addMsg(l.conv, "eu", "[Modelo " + a.modelo + "] " + a.txt.replace("{{1}}", l.tutor.split(" ")[0]).replace("{{2}}", (l.pets[0] || { n: "pet" }).n).replace("{{3}}", loja(l.loja).nome).replace("{{4}}", "3"));
  l.tl.unshift([agora(), "Mensagem", "Automação: " + a.nome]); CONVS[l.conv].estado = CONVS[l.conv].estado === "encerrada" ? "ia" : CONVS[l.conv].estado;
  toast("Enviado para " + l.tutor.split(" ")[0] + " (" + custo + " créditos). Resposta do tutor cai em Conversas."); render();
}

/* ================= Configurações da loja ================= */
function viewCfg() {

  var b = "";
  if (st.cfgTab === "canal") {
    b = '<div class="grid g2">' + LOJAS.map(function (l) {

      return '<section class="panel"><header><h3>' + tagLoja(l.id) + '</h3><span class="pill ' + (ok ? "ok" : "warn") + '">' + (ok ? "Conectado" : "Não conectado") + '</span></header><p class="mono">' + l.num + '</p><p class="small">Qualidade do número: ' + l.q + "</p>" +
        (ok ? '<div class="row" style="margin-top:8px"><button class="btn sm" type="button" data-act="toast" data-t="Teste enviado (simulado)">Enviar teste</button></div>' : '<button class="btn pri sm" type="button" style="margin-top:8px" data-act="conectar" data-id="' + l.id + '">Conectar número</button>') + "</section>";
    }).join("") + '</div><div class="note warn" style="margin-top:12px"><b>Decisão pendente (Etapa 4):</b> como cada loja conecta o número oficial (parceiro de tecnologia da Meta ou intermediário). O assistente de conexão abaixo é só uma ilustração.</div>';
  } else if (st.cfgTab === "funil") {
    b = '<section class="panel"><header><h3>Etapas do funil</h3><span class="small">A loja nomeia e ordena. Ganho e Perdido são finais.</span></header>' + ETAPAS.map(function (e, i) { return '<label class="f" style="margin-bottom:8px">Etapa ' + (i + 1) + '<input type="text" data-act="renomear" data-i="' + i + '" value="' + esc(e.n) + '"' + '></label>'; }).join("") + '<button class="btn sm" type="button" data-act="toast" data-t="Nova etapa criada (simulado)">Adicionar etapa</button></section>';
  } else if (st.cfgTab === "cons") {
    b = '<div class="grid g2"><section class="panel"><header><h3>Como o consentimento é pedido</h3></header><ol class="steps"><li><span class="n">1</span><span>Aceite no cadastro ou no PDV, com texto, usuário e data.</span></li><li><span class="n">2</span><span>Mensagem de confirmação pelo WhatsApp com botão.</span></li><li><span class="n">3</span><span>O toque no botão vira a segunda prova. SAIR cancela na hora.</span></li></ol><div class="note warn" style="margin-top:10px"><b>A decidir (Etapa 0.7):</b> a forma final de pedir o aceite e o que fazer com os tutores atuais.</div></section>' +
      '<section class="panel"><header><h3>Situação dos tutores</h3></header>' + ["ok", "sistema", "nao", "saiu"].map(function (k) { var n = LEADS.filter(function (l) { return l.consent === k; }).length; return '<p class="row" style="justify-content:space-between;margin:6px 0">' + pillCons(k) + "<b>" + n + "</b></p>"; }).join("") + "</section></div>";
  } else if (st.cfgTab === "ia") {
    b = '<div class="grid g2"><section class="panel"><header><h3>Atendimento por IA</h3></header><label class="f">Tom de voz<select id="tom">' + ["Amigável", "Formal", "Descontraído"].map(function (t) { return "<option" + (st.tom === t ? " selected" : "") + ">" + t + "</option>"; }).join("") + "</select></label>" +
      '<label class="f" style="margin-top:8px">Horário de atendimento humano<input type="text" value="Seg a Sáb, 8h às 18h"></label><p class="small" style="margin-top:6px">Fora do horário, a IA avisa o prazo de retorno.</p></section>' +
      '<section class="panel"><header><h3>O que a IA pode fazer sozinha</h3></header>' + [["agenda", "Consultar horários de banho e consulta"], ["pedido", "Criar pedido para retirada ou entrega"], ["cupom", "Oferecer cupom de desconto"]].map(function (x) { return '<label class="sw"><input type="checkbox" data-act="ia-perm" data-k="' + x[0] + '"' + (st.ia[x[0]] ? " checked" : "") + ">" + x[1] + "</label><br>"; }).join("") +
      '<p class="small" style="margin-top:6px">Ações que gravam dados pedem confirmação do tutor e ficam na trilha de auditoria. Sempre transfere para humano em reclamação e quando o tutor pede.</p></section></div>';
  } else {
    b = '<div class="grid g2"><section class="panel kpi"><header><h3>Saldo de créditos</h3></header><div class="v">' + st.saldo.toLocaleString("pt-BR") + '</div><p class="small">Mensagens com modelo e respostas da IA consomem créditos.</p>' +
      '<div class="row" style="margin-top:10px">' + PACOTES.map(function (p, i) { return '<button class="btn sm" type="button" data-act="comprar" data-i="' + i + '">' + p[0] + " · R$ " + p[1] + "</button>"; }).join("") + "</div></section>" +
      '<section class="panel"><header><h3>Extrato</h3></header><div class="scroll"><table><tbody>' + st.extrato.slice(0, 8).map(function (e) { return "<tr><td class=\"mono\">" + e[0] + "</td><td>" + esc(e[1]) + '</td><td style="text-align:right"><b>' + e[2] + "</b></td></tr>"; }).join("") + "</tbody></table></div></section></div>";
  }
  return nav + b;
}

/* ================= OPS ================= */
function viewOps() {
  var tabs = [["lojas", "Lojas e números"], ["modelos", "Modelos aprovados"], ["pacotes", "Pacotes de créditos"], ["prov", "Provedor"]];
  var nav = '<div class="row" style="margin-bottom:12px">' + tabs.map(function (t) { return '<button class="chip" type="button" data-act="opstab" data-id="' + t[0] + '" aria-pressed="' + (st.opsTab === t[0]) + '">' + t[1] + "</button>"; }).join("") + "</div>";
  var b = "";
  if (st.opsTab === "lojas") b = '<section class="panel"><div class="scroll"><table><thead><tr><th>Loja</th><th>Número</th><th>Qualidade</th><th>Mensagens (30 dias)</th><th>Créditos usados</th></tr></thead><tbody>' + LOJAS.map(function (l) { return "<tr><td>" + tagLoja(l.id) + "</td><td class=\"mono\">" + l.num + "</td><td><span class=\"pill " + (l.q === "Alta" ? "ok" : "") + "\">" + l.q + "</span></td><td>" + l.msgs + "</td><td>" + l.cred.toLocaleString("pt-BR") + "</td></tr>"; }).join("") + '</tbody></table></div><p class="note" style="margin-top:10px">Cada loja tem o seu número. Qualidade baixa de um número afeta só aquela loja.</p></section>';
  else if (st.opsTab === "modelos") b = '<section class="panel"><header><h3>Catálogo de modelos</h3><span class="small">O CorePet cadastra e acompanha a aprovação na Meta para cada loja.</span></header><div class="scroll"><table><thead><tr><th>Modelo</th><th>Categoria</th><th>Situação</th><th>Texto</th></tr></thead><tbody>' + AUTO.map(function (a) { return '<tr><td class="mono">' + a.modelo + "</td><td>" + a.cat + '</td><td><span class="pill ' + (a.meta === "Aprovado" ? "ok" : "warn") + '">' + a.meta + '</span></td><td style="min-width:260px">' + tpl(a.txt, a.ex) + "</td></tr>"; }).join("") + "</tbody></table></div></section>";
  else if (st.opsTab === "pacotes") b = '<section class="panel"><header><h3>Pacotes de créditos</h3><span class="small">Valores de exemplo. A cobrança detalhada será definida depois.</span></header>' + PACOTES.map(function (p, i) { return '<div class="row" style="margin-bottom:8px"><label class="f" style="flex:1;min-width:160px">Pacote<input type="text" value="' + p[0] + '"></label><label class="f">Preço (R$)<input type="number" value="' + p[1] + '"></label></div>'; }).join("") + '<div class="row"><label class="f">Créditos por modelo (Utilidade)<input type="number" value="2"></label><label class="f">Créditos por modelo (Marketing)<input type="number" value="4"></label><label class="f">Créditos por resposta da IA<input type="number" value="3"></label></div></section>';
  else b = '<div class="grid g2"><section class="panel"><header><h3>Provedor do WhatsApp</h3><span class="pill warn">A decidir</span></header><p class="muted">Parceiro de tecnologia da Meta ou intermediário oficial. O código mantém o provedor trocável.</p><label class="f" style="margin-top:8px">Opção em avaliação<select><option>API da Meta como parceiro de tecnologia</option><option>Intermediário oficial (ex.: 360dialog)</option></select></label></section>' +
    '<section class="panel"><header><h3>E-mail</h3><span class="pill warn">Gmail (MVP)</span></header><p class="muted">Provedor profissional com SPF, DKIM e DMARC fica para o fim do projeto.</p></section></div>';
  return nav + b;
}

/* ================= Mapa ================= */
function viewMapa() {
  var rows = [["Kanban com filtro de lojas e loja em cada card", "Etapa 2 · Fase 2 P.2"], ["Ficha 360 e oportunidades", "Etapa 3 · P.3"], ["Caixa de conversas, assumir e devolver, janela de 24h", "Etapa 5 · P.4"], ["IA, parada, resumo para humano, créditos", "Etapas 0.1, 0.2 e 6 · P.5"], ["Automações, limites e consentimento", "Etapa 7 e 0.7 · P.6"], ["Canal por loja, funil, créditos, OPS", "Etapas 1, 4 e tema T.1 · P.7"]];
  return '<section class="panel"><header><h3>O que cada tela cobre no roadmap</h3></header><div class="scroll"><table><tbody>' + rows.map(function (r) { return "<tr><td>" + r[0] + '</td><td class="small">' + r[1] + "</td></tr>"; }).join("") + '</tbody></table></div></section>' +
    '<section class="panel" style="margin-top:14px"><header><h3>Experimente</h3></header><ol class="steps"><li><span class="n">1</span><span>Kanban: arraste um card, filtre as lojas e abra a ficha de um tutor.</span></li><li><span class="n">2</span><span>Conversas: em "Camila", clique em Simular mensagem. A IA responde e gasta créditos. Quando o texto pede atendente, a conversa vai para a fila humana com resumo.</span></li><li><span class="n">3</span><span>Assuma a conversa da Juliana e veja o texto livre e a janela de 24h. Em Aline, a janela está fechada.</span></li><li><span class="n">4</span><span>Paulo disse SAIR e Henrique não tem consentimento: veja os bloqueios, inclusive em Automações > Simular disparo.</span></li></ol></section>';
}

/* ================= Render e eventos ================= */
function render() {
  renderTop();
  var v = { kanban: viewKanban, conversas: viewConversas, auto: viewAuto, cfg: viewCfg, ops: viewOps, mapa: viewMapa }[st.tab];
  var foco = document.activeElement && document.activeElement.id;
  $("main").innerHTML = v(); $("drawer").innerHTML = viewDrawer();
  var ch = $("chat"); if (ch) ch.scrollTop = ch.scrollHeight;
  if (foco === "busca") { var e = $("busca"); e.focus(); e.setSelectionRange(e.value.length, e.value.length); }
}
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]"); if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  var a = b.dataset.act, id = b.dataset.id;
  if (a === "aba") { st.tab = id; st.lead = null; }
  else if (a === "loja") { st.lojas[id] = !st.lojas[id]; if (!Object.keys(st.lojas).some(function (k) { return st.lojas[k]; })) st.lojas[id] = true; }
  else if (a === "lojas-todas") { Object.keys(st.lojas).forEach(function (k) { st.lojas[k] = true; }); }
  else if (a === "abrir-lead") st.lead = +id;
  else if (a === "fechar-lead") st.lead = null;
  else if (a === "ir-conversa") { st.tab = "conversas"; st.conv = +id; st.lead = null; }
  else if (a === "conv") st.conv = +id;
  else if (a === "novo-lead") { var nid = LEADS.length + 1; LEADS.unshift({ id: nid, tutor: "Novo lead " + nid, tel: "(11) 90000-000" + nid, loja: Object.keys(st.lojas).filter(function (k) { return st.lojas[k]; })[0], etapa: "novo", origem: "WhatsApp espontâneo", resp: "Sem responsável", valor: 0, prox: "Qualificar o lead", consent: "nao", cad: false, pets: [], conv: nid, tl: [[agora(), "Lead", "Criado manualmente"]], opp: [] }); CONVS[nid] = { estado: "ia", janela: 99, nao: 0, msgs: [m("sis", "Lead criado manualmente. Sem consentimento: apenas resposta ao tutor é permitida.", "")] }; toast("Lead criado na etapa Novo."); }
  else if (a === "vincular") { var l = lead(+id); l.cad = true; l.tutor = "Fernanda Ribeiro"; l.pets = [{ n: "Toby", d: "Spitz, 3 anos" }]; l.opp = ["Cadastro vinculado: ofereça os serviços para o Toby"]; l.tl.unshift([agora(), "Cadastro", "Vinculado a Fernanda Ribeiro"]); toast("Lead vinculado a um cadastro existente (simulado)."); }
  else if (a === "assumir") { var c = CONVS[st.conv]; c.estado = "humano"; addMsg(st.conv, "sis", "Atendimento assumido por Marina. A IA não responde mais nesta conversa."); }
  else if (a === "devolver") { CONVS[st.conv].estado = "ia"; addMsg(st.conv, "sis", "Conversa devolvida à IA."); }
  else if (a === "encerrar") { CONVS[st.conv].estado = "encerrada"; addMsg(st.conv, "sis", "Atendimento encerrado."); }
  else if (a === "enviar") { var t = $("txt"); if (!t || !t.value.trim()) return; addMsg(st.conv, "eu", t.value.trim()); cobrar(1, "Resposta do atendente"); }
  else if (a === "nota") { var t2 = $("txt"); if (!t2 || !t2.value.trim()) return toast("Escreva a nota no campo e clique de novo."); addMsg(st.conv, "nota", t2.value.trim()); }
  else if (a === "sim-tutor") { return simTutor(); }
  else if (a === "modelo") { var ll = lead(+id); if (ll.consent === "saiu" || ll.consent === "nao") return toast("Bloqueado: tutor sem consentimento. Nada enviado."); if (st.saldo < 2) return toast("Créditos insuficientes."); addMsg(ll.conv, "eu", "[Modelo reativacao_v1] Olá, " + ll.tutor.split(" ")[0] + "! Sentimos sua falta. Quer ver as novidades da loja?"); cobrar(4, "Modelo reativacao_v1 · " + ll.tutor.split(" ")[0]); CONVS[ll.conv].estado = CONVS[ll.conv].estado === "encerrada" ? "ia" : CONVS[ll.conv].estado; toast("Modelo enviado (4 créditos)."); }
  else if (a === "disparar") return disparar(+b.dataset.i);
  else if (a === "cfgtab") st.cfgTab = id; else if (a === "opstab") st.opsTab = id;
  else if (a === "toast") return toast(b.dataset.t);
  else if (a === "conectar") { var lj = loja(id); lj.num = "+55 11 3000-3333"; lj.q = "Alta"; toast("Número conectado (simulado). A conexão real será decidida na Etapa 4."); }
  else if (a === "comprar") { var p = PACOTES[+b.dataset.i]; var n = parseInt(p[0].replace(/\D/g, ""), 10); st.saldo += n; st.extrato.unshift([agora(), "Pacote " + p[0], "+" + n]); toast("Pacote adicionado ao saldo (simulado)."); }
  render();
});
document.addEventListener("change", function (e) {
  var t = e.target, a = t.dataset.act;
  if (!a && ["fresp", "forig", "freq", "sil", "tom"].indexOf(t.id) < 0) return;
  if (a === "mover") return moverLead(+t.dataset.id, t.value);
  if (a === "auto-on") { AUTO[+t.dataset.i].on[t.dataset.l] = t.checked; toast(AUTO[+t.dataset.i].nome + ": " + (t.checked ? "ligada" : "desligada") + " em " + loja(t.dataset.l).nome + "."); }
  else if (a === "ia-perm") { st.ia[t.dataset.k] = t.checked; toast("Preferência salva."); }
  else if (a === "renomear") { ETAPAS[+t.dataset.i].n = t.value; }
  else if (t.id === "fresp") st.resp = t.value; else if (t.id === "forig") st.origem = t.value;
  else if (t.id === "freq") st.freq = Math.max(1, +t.value || 1); else if (t.id === "sil") st.silencio = t.checked; else if (t.id === "tom") st.tom = t.value;
  render();
});
document.addEventListener("input", function (e) { if (e.target.id === "busca") { st.busca = e.target.value; render(); } });
/* arrastar e soltar */
document.addEventListener("dragstart", function (e) { var c = e.target.closest && e.target.closest(".card"); if (!c) return; e.dataTransfer.setData("text/plain", c.dataset.id); e.dataTransfer.effectAllowed = "move"; });
document.addEventListener("dragover", function (e) { var col = e.target.closest && e.target.closest(".colk"); if (col) { e.preventDefault(); document.querySelectorAll(".colk.over").forEach(function (x) { if (x !== col) x.classList.remove("over"); }); col.classList.add("over"); } });
document.addEventListener("drop", function (e) { var col = e.target.closest && e.target.closest(".colk"); if (!col) return; e.preventDefault(); var id = +e.dataTransfer.getData("text/plain"); moverLead(id, col.dataset.col); });
document.addEventListener("dragend", function () { document.querySelectorAll(".colk.over").forEach(function (x) { x.classList.remove("over"); }); });
render();
</script>
