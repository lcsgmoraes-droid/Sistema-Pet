name: corepet-homolog

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql://corepet_homolog:${HOMOLOG_POSTGRES_PASSWORD}@postgres:5432/corepet_homolog
  JWT_SECRET_KEY: ${HOMOLOG_JWT_SECRET_KEY}
  PAYMENT_CONFIG_ENCRYPTION_KEY: ${HOMOLOG_PAYMENT_CONFIG_ENCRYPTION_KEY}
  ENVIRONMENT: staging
  APP_ENV: staging
  ENV: staging
  DEBUG: "false"
  SYSTEM_NAME: CorePet Homologacao
  SYSTEM_VERSION: homolog-local
  FRONTEND_URL: http://127.0.0.1:18080
  ECOMMERCE_BASE_URL: http://127.0.0.1:18080
  ECOMMERCE_PUBLIC_BASE_URL: http://127.0.0.1:18080
  ALLOWED_ORIGINS: http://127.0.0.1:18080,http://localhost:18080
  TRUSTED_PROXY_CIDRS: 127.0.0.0/8,::1/128,172.16.0.0/12
  EMAIL_VERIFICATION_REQUIRED: "false"
  SQL_AUDIT_ENFORCE: "true"
  SQL_AUDIT_ENFORCE_LEVEL: error
  ENABLE_GUARDRAILS: "true"
  RATE_LIMIT_ENABLED: "true"
  UVICORN_WORKERS: "2"
  WATCHDOG_ENABLED: "true"
  WATCHDOG_URL: http://127.0.0.1:8000/health/watchdog
  BLING_SYNC_SCHEDULER_ENABLED: "false"
  BLING_PEDIDO_WEBHOOK_ASYNC: "false"
  IFOOD_CATALOG_WRITE_ENABLED: "false"
  IFOOD_ORDER_OPERATIONS_ENABLED: "false"
  IFOOD_ORDER_POLLING_ENABLED: "false"
  ECOMMERCE_PAYMENT_GATEWAY_ENABLED: "false"
  ASAAS_ENVIRONMENT: sandbox
  ASAAS_API_KEY: ""
  STONE_SANDBOX: "true"
  SEFAZ_ENABLED: "false"
  SEFAZ_MODO: mock
  SEFAZ_AMBIENTE: homologacao
  SEFAZ_IMPORTACAO_AUTOMATICA: "false"
  VET_EVIDENCE_SYNC_ENABLED: "false"
  VET_REGULATORY_SYNC_ENABLED: "false"
  OPENAI_API_KEY: ""
  GOOGLE_MAPS_API_KEY: ""
  OPS_ALERT_WEBHOOK_URL: ""
  OPS_ALERT_EMAIL_TO: ""
  PRODUCT_IMAGE_STORAGE_BACKEND: local
  PRODUCT_IMAGE_LOCAL_BASE_DIR: uploads/produtos
  LOG_LEVEL: INFO
  TZ: America/Sao_Paulo

services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: corepet_homolog
      POSTGRES_USER: corepet_homolog
      POSTGRES_PASSWORD: ${HOMOLOG_POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - homolog_postgres_data:/var/lib/postgresql/data
    networks:
      - homolog_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corepet_homolog -d corepet_homolog"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: corepet-backend:homolog
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - homolog_network

  backend:
    image: corepet-backend:homolog
    restart: unless-stopped
    environment: *backend-environment
    volumes:
      - homolog_uploads:/app/uploads
      - homolog_logs:/app/logs
      - homolog_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - homolog_network
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-fsS",
          "--max-time",
          "7",
          "http://localhost:8000/health/watchdog",
        ]
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    image: corepet-frontend:homolog
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./nginx/homolog.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - homolog_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

volumes:
  homolog_postgres_data:
  homolog_uploads:
  homolog_logs:
  homolog_data:

networks:
  homolog_network:
    driver: bridge
